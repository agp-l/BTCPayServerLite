name: PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: php-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Contract tests
        run: |
          set -eu
          for test_file in tests/*Test.php; do
            php "$test_file"
          done

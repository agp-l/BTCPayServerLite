name: PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: php-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      BTCPAY_TEST_MYSQL_HOST: 127.0.0.1
      BTCPAY_TEST_MYSQL_PORT: 3306
      BTCPAY_TEST_MYSQL_USER: root
      BTCPAY_TEST_APACHE_BINARY: /usr/sbin/apache2
      BTCPAY_TEST_APACHE_MODULES: /usr/lib/apache2/modules
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, pdo_mysql, pdo_sqlite, gmp, bcmath, pcntl, posix, dom, simplexml
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Apache boundary fixture
        run: |
          if [ ! -x /usr/sbin/apache2 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y apache2
          fi
      - name: PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Contract tests
        run: |
          set -eu
          for test_file in tests/*Test.php; do
            php "$test_file"
          done
